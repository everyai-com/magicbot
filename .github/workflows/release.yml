# MagicBot's release pipeline: tag-driven, publishes straight to this repo's
# own Releases with the secrets this org actually holds.
#
# Upstream (OpenMausBot) ships a much larger three-platform workflow that
# assembles a draft on a separate `openmausbot-releases` repo using an
# Apple API key and a RELEASES_PAT. We keep our own single-target macOS
# pipeline instead — it is the one wired to everyai-com's certificates —
# but it now drives upstream's packaging scripts (package:prepare,
# build:speech, build:recorder, build:cua) rather than the pre-sync
# hand-rolled swiftc invocations, which no longer exist.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.32"
        required: true
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # no `version:` — pnpm/action-setup reads packageManager from
      # package.json so the lockfile is resolved by the pnpm that wrote it
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Clean generated output
        run: rm -rf dist dist-server dist-native dist-companion release

      - name: Build UI, server, companion, updater and the native helpers
        run: |
          pnpm package:prepare
          pnpm build:speech
          pnpm build:recorder
          pnpm build:cua

      - name: Package, sign & notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Notarize only when Apple-ID credentials are present; otherwise
          # ship a signed-but-unnotarized build (still installs, shows the
          # Gatekeeper prompt). Add APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD
          # secrets to auto-upgrade to notarized on the next tag.
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "Apple ID present — building notarized."
            npx electron-builder --mac --publish never \
              -c.mac.notarize=true
          else
            echo "No Apple ID secrets — building signed only (not notarized)."
            npx electron-builder --mac --publish never
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          shopt -s nullglob
          ASSETS=(release/*.dmg release/*.zip release/latest-mac.yml)
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "MagicBot $TAG" \
            --generate-notes \
            "${ASSETS[@]}" \
            || gh release upload "$TAG" \
                 --repo "${{ github.repository }}" --clobber \
                 "${ASSETS[@]}"
