name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.3"
        required: true
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Build UI + server + Swift helpers
        run: |
          pnpm build
          pnpm build:server
          pnpm build:speech
          pnpm build:perm

      - name: Package, sign & notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Notarize only when Apple-ID credentials are present; otherwise
          # ship a signed-but-unnotarized build (still installs, shows the
          # Gatekeeper prompt). Add APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD
          # secrets to auto-upgrade to notarized on the next tag.
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "Apple ID present — building notarized."
            npx electron-builder --mac --publish never \
              -c.mac.notarize=true
          else
            echo "No Apple ID secrets — building signed only (not notarized)."
            npx electron-builder --mac --publish never
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          shopt -s nullglob
          ASSETS=(release/*.dmg release/*.zip release/latest-mac.yml)
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "MagicBot $TAG" \
            --generate-notes \
            "${ASSETS[@]}" \
            || gh release upload "$TAG" \
                 --repo "${{ github.repository }}" --clobber \
                 "${ASSETS[@]}"
